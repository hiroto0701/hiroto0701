name: Update Credly Badges

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: kpab/credly-readme@17448bb56b54f332cd2bef5a3d846f00157a2040 # v1.0.1
        with:
          credly_user: hiroto-inagaki.b6531b88
          sort: LATEST
          badge_width: 100
